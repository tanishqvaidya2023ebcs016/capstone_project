# ============================================================
# Sentinel Config — Mac (runs in Docker with network_mode: host)
# ============================================================

port 26379

# IMPORTANT: set this to Mac's actual Tailscale IP so Oracle/Windows
# sentinels can reach this sentinel. Get it with: tailscale ip -4
sentinel announce-ip 100.109.122.25 
sentinel announce-port 26379

# Monitor the Redis master at Mac's Tailscale IP
# Quorum = 2: need 2 out of 3 sentinels to agree master is down
sentinel monitor mymaster 100.109.122.25 6379 2

# Mark master as down after 5 seconds of no response (ODOWN)
sentinel down-after-milliseconds mymaster 5000

# Failover timeout: how long to wait for a replica to become master
sentinel failover-timeout mymaster 30000

# Only sync one replica at a time during failover to avoid overload
sentinel parallel-syncs mymaster 1

# Use IPs not hostnames (important for Docker)
sentinel resolve-hostnames no
sentinel announce-hostnames no

loglevel notice
logfile ""