# Persistence — survive container restarts without losing queue state
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
 
# RDB snapshots as backup
save 900 1
save 300 10
save 60 10000
 
# Allow replicas to serve (potentially slightly stale) data during resync
replica-serve-stale-data yes
replica-read-only yes
 
# How long to wait before considering a replica disconnected
repl-timeout 60
 
# Memory — adjust to your Mac's RAM. Comment out if unsure.
maxmemory 512mb
maxmemory-policy allkeys-lru
 
loglevel notice
logfile ""