# ============================================================
# Redis Replica Config — Oracle VM
# ============================================================

bind 0.0.0.0
protected-mode no
port 6379

# Replicate from Mac's Redis master (update IP if Mac's Tailscale IP changes)
replicaof 100.109.122.25 6379

# Replicas are read-only by default; Sentinel will turn this off after promotion
replica-read-only yes

# Serve (potentially slightly stale) data while re-syncing from master
replica-serve-stale-data yes

# Persistence — keep data alive if this VM restarts
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

repl-timeout 60
loglevel notice
logfile /var/log/redis/redis-replica.log
dir /var/lib/redis
