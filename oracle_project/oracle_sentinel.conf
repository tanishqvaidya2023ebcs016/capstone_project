# ============================================================
# Sentinel Config — Oracle VM
# ============================================================

port 26379

# UPDATE: set to Oracle's actual Tailscale IP (run: tailscale ip -4)
sentinel announce-ip ORACLE_TAILSCALE_IP
sentinel announce-port 26379

# Monitor Mac's Redis master. Quorum = 2 (need 2 out of 3 sentinels to agree)
sentinel monitor mymaster 100.109.122.25 6379 2

# After 5 seconds with no response, mark master as subjectively down (SDOWN)
sentinel down-after-milliseconds mymaster 5000

# Failover timeout
sentinel failover-timeout mymaster 30000

# Sync one replica at a time after promotion
sentinel parallel-syncs mymaster 1

sentinel resolve-hostnames no
sentinel announce-hostnames no

loglevel notice
logfile /var/log/redis/sentinel.log
dir /var/lib/redis
